{# 
  Umumiy baza shablon. Har bir slayd shu asosda quriladi.
  {{ theme }} orqali rang sxemasi tanlanadi: minimal / corporate / gradient_dark / warm
#}
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Manrope:wght@400;600;800&display=swap');

  :root {
    {% if theme == 'gradient_dark' %}
      --bg: #12121f;
      --bg-gradient: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      --text-primary: #ffffff;
      --text-secondary: #d4d4de;
      --accent: #8b7cf6;
      --accent-2: #22d3ee;
      --card-bg: rgba(255,255,255,0.08);
    {% elif theme == 'corporate' %}
      --bg: #ffffff;
      --bg-gradient: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #33415a;
      --accent: #1d4ed8;
      --accent-2: #0ea5e9;
      --card-bg: #f1f5f9;
    {% elif theme == 'warm' %}
      --bg: #fdf6ec;
      --bg-gradient: linear-gradient(135deg, #fdf6ec 0%, #fbe8d3 100%);
      --text-primary: #2b1d13;
      --text-secondary: #5c4330;
      --accent: #c2571f;
      --accent-2: #b83a3a;
      --card-bg: rgba(224,122,62,0.1);
    {% else %} {# minimal #}
      --bg: #fafafa;
      --bg-gradient: #fafafa;
      --text-primary: #0d0d0d;
      --text-secondary: #3d3d3d;
      --accent: #111111;
      --accent-2: #555555;
      --card-bg: #ffffff;
    {% endif %}
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: var(--bg-gradient);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .slide {
    width: 1920px;
    height: 1080px;
    padding: 100px 120px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .accent-bar {
    position: absolute;
    top: 0; left: 0;
    width: 12px; height: 100%;
    background: linear-gradient(180deg, var(--accent), var(--accent-2));
  }

  .heading {
    font-family: 'Manrope', sans-serif;
    font-weight: 800;
    font-size: 64px;
    line-height: 1.15;
    color: var(--text-primary);
    margin-bottom: 48px;
  }

  .subheading {
    font-size: 32px;
    color: var(--text-secondary);
    font-weight: 500;
  }

  .page-number {
    position: absolute;
    bottom: 48px;
    right: 60px;
    font-size: 20px;
    color: var(--text-secondary);
    opacity: 0.7;
  }

  {% block extra_style %}{% endblock %}
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
