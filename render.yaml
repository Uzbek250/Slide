# Render.com uchun "Infrastructure as Code" fayli.
# Bu fayl repo ildizida bo'lsa, Render dashboardida "New Blueprint"
# orqali servisni avtomatik sozlab yaratish mumkin.
#
# MUHIM: Chromium bilan render qilish uchun kamida "Starter" tarif (1GB+ RAM)
# tavsiya etiladi. Free tarif (512MB) beqaror ishlashi mumkin.

services:
  - type: web
    name: slide-bot-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter  # free emas — Chromium uchun 512MB yetarli emas
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Render dashboardida qo'lda kiritiladi (sirni git'ga qo'ymaslik uchun)
    healthCheckPath: /health
